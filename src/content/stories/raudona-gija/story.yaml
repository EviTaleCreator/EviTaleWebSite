  lt: Kikilis Čiūta tupi lizde gudobelių krūme, apsikabinęs raudoną vilnonį siūlą, o draugė Guoda skrenda šalia ir kviečia jį prie upelio
  en: Ciuta the chaffinch sits in his nest in a hawthorn bush, hugging a red woollen thread, while his friend Guoda flies beside him, calling him to the stream
