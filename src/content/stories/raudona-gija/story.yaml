title:
  lt: Raudona gija gudobelių krūme
  en: The Red Thread in the Hawthorn

excerpt:
  lt: Apie kikilį Čiūtą, kuris rado šiltą raudoną siūlą ir taip bijojo jį prarasti, kad pamiršo skraidyti.
  en: About Ciuta the chaffinch, who found a warm red thread and got so scared of losing it that he forgot how to fly.

