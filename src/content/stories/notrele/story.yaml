date: 2026-11-08

title:
  lt: Notrelė
  en: The White Archangel

excerpt:
  lt: Apie notrelę, kuri taip ilgai apsimetinėjo dilgėle, kad pati pamiršo savo baltus, saldžius žiedus.
  en: About a white archangel, a flower that looks just like a nettle, who pretended to be a stinging nettle for so long that she forgot her own sweet white flowers.

# Pagrindinė iliustracija, šalia šio failo.
cover: ./cover.jpg
coverAlt:
  lt: Prie senos daržinės akmeninio pamato tarp tamsių dilgėlių auga notrelė su baltais žiedais, šalia surūdijusios akėčios, o saulėtame pakraštyje žydi ramunėlė
  en: By the stone foundation of an old barn, among dark nettles and next to a rusty harrow, grows a white archangel, with a daisy blooming at the sunny edge
