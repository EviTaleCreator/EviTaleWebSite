coverAlt:
  lt: Lėta upė vingiuoja per pievą po senu gluosniu, prie medinio lieptelio trys vaikai leidžia į vandenį pušies žievės laivelius su plunksnų burėmis
  en: A slow river winds through a meadow under an old willow, and by a wooden footbridge three children float pine bark boats with feather sails
