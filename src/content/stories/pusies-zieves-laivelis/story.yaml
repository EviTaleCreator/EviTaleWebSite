title:
  lt: Pušies žievės laivelis
  en: The Pine Bark Boat

excerpt:
  lt: Apie lėtą upę Alantą, kuri užsimanė šniokšti kaip kaimynė Žvelsa, ir apie tai, ką ji prarado, kai pagaliau pradėjo.
  en: About Alanta, a slow river who wanted to roar like her neighbour Zvelsa, and what she lost when she finally did.

